apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenfit-studio
  labels:
    app: zenfit-studio

spec:
  replicas: 2

  selector:
    matchLabels:
      app: zenfit-studio

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: zenfit-studio

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      securityContext:
        fsGroup: 101
      containers:
        - name: zenfit-studio
          image: ghcr.io/kgomotso1995/zenfit-studio:latest
          imagePullPolicy: Always