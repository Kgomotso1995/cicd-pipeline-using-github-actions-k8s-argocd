apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdant-homes
  labels:
    app: verdant-homes

spec:
  replicas: 2

  selector:
    matchLabels:
      app: verdant-homes

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: verdant-homes

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      securityContext:
        fsGroup: 101
      containers:
        - name: verdant-homes
          image: ghcr.io/kgomotso1995/verdant-homes:latest
          imagePullPolicy: Always