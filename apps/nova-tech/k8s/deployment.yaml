apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-tech
  namespace: sites-staging
  labels:
    app: nova-tech
    env: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nova-tech
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nova-tech
        env: dev
    spec:
      containers:
        - name: nova-tech
          image: ghcr.io/YOUR_ORG/nova-tech:dev-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
