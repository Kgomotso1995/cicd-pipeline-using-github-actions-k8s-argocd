apiVersion: apps/v1
kind: Deployment
metadata:
  name: arclight-agency
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arclight-agency

  template:
    metadata:
      labels:
        app: arclight-agency

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      securityContext:
        fsGroup: 101   # 🔑 critical

      containers:
        - name: arclight-agency
          image: ghcr.io/kgomotso1995/arclight_agency:staging
          imagePullPolicy: Always

          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false

          ports:
            - containerPort: 8080   # 🔥 FIXED

          livenessProbe:
            httpGet:
              path: /
              port: 8080

          readinessProbe:
            httpGet:
              path: /
              port: 8080

          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp

      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}