apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-tech
  namespace: staging
  labels:
    app: nova-tech
    env: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nova-tech

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: nova-tech
        env: dev

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      securityContext:
        fsGroup: 101

      containers:
        - name: nova-tech
          image: ghcr.io/kgomotso1995/nova_tech:staging
          imagePullPolicy: Always

          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false

          ports:
            - containerPort: 80

          # 🚀 FIX: ensures pod is fully started before probes begin
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
            periodSeconds: 5

          # 👀 controls traffic readiness only
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          # ❤️ checks if container is alive (ONLY after startupProbe passes)
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp

      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}