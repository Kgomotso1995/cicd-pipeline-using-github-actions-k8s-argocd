apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-tech
  namespace: production
  labels:
    app: nova-tech
    env: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nova-tech
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nova-tech
        env: prod
    spec:
      containers:
        - name: nova-tech
          image: ghcr.io/kgomotso1995/nova_tech:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"